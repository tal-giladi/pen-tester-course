# lab-02-recon web host — several virtual hosts with distinct fingerprints.
# Everything here is benign lab content for recon practice.

# --- www / apex (default server) ------------------------------------------------
server {
    listen 80 default_server;
    server_name northwind.lab www.northwind.lab;
    root /usr/share/nginx/html/www;
    index index.html;
    location = /robots.txt { root /usr/share/nginx/html/www; }
    location = /sitemap.xml { root /usr/share/nginx/html/www; }
}

# --- shop (leaks an app-server banner) ------------------------------------------
server {
    listen 80;
    server_name shop.northwind.lab;
    add_header X-Powered-By "PHP/8.2.12" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    root /usr/share/nginx/html/shop;
    index index.html;
}

# --- dev (verbose, debug headers — a classic non-prod leak) ---------------------
server {
    listen 80;
    server_name dev.northwind.lab;
    add_header X-Debug-Mode "on" always;
    add_header X-Powered-By "Django/4.2 (DEBUG=True)" always;
    root /usr/share/nginx/html/dev;
    index index.html;
}

# --- api (JSON, version header) -------------------------------------------------
server {
    listen 80;
    server_name api.northwind.lab;
    add_header X-Api-Version "v1 (deprecated; see v2)" always;
    default_type application/json;
    location / { return 200 '{"service":"northwind-api","version":"1.4.2","docs":"/swagger.json"}'; }
    location = /swagger.json { return 200 '{"openapi":"3.0.0","info":{"title":"Northwind API","version":"1.4.2"},"paths":{"/orders/{id}":{"get":{}},"/users/{id}":{"get":{}}}}'; }
}

# --- admin (in DNS, disallowed in robots) ---------------------------------------
server {
    listen 80;
    server_name admin.northwind.lab;
    root /usr/share/nginx/html/admin;
    index index.html;
}

# --- vpn-old (old appliance banner — an identity-edge target) -------------------
server {
    listen 80;
    server_name vpn-old.northwind.lab;
    add_header Server "SSL-VPN/8.1" always;
    root /usr/share/nginx/html/vpn;
    index index.html;
}

# --- promo / checkout (thin pages, still part of the surface) -------------------
server {
    listen 80;
    server_name promo.northwind.lab checkout.northwind.lab;
    root /usr/share/nginx/html/www;
    index index.html;
}

# --- staging: NOT in DNS. Only reachable by sending Host: staging.northwind.lab.
#     This is the vhost that DNS alone never reveals (found via vhost fuzzing). ---
server {
    listen 80;
    server_name staging.northwind.lab;
    add_header X-Environment "staging-internal" always;
    root /usr/share/nginx/html/staging;
    index index.html;
}

# --- TLS: cert SANs include legacy.northwind.lab (found via cert pivoting) -------
server {
    listen 443 ssl;
    server_name www.northwind.lab shop.northwind.lab legacy.northwind.lab;
    ssl_certificate     /etc/nginx/certs/northwind.crt;
    ssl_certificate_key /etc/nginx/certs/northwind.key;
    root /usr/share/nginx/html/www;
    index index.html;
    location = /legacy { return 200 "legacy.northwind.lab — old portal (found via cert SAN)\n"; }
}
