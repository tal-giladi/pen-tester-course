// ns2 — a forgotten SECONDARY, MISCONFIGURED: allow-transfer { any; }.
// This is the deliberate flaw — AXFR against ns2 dumps the whole zone to anyone.
options {
    directory "/var/cache/bind";
    recursion no;
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-transfer { any; };        // THE MISCONFIG: world-readable zone transfer
};

zone "northwind.lab" {
    type master;                     // holds its own copy for the lab (simpler than a real xfer)
    file "/etc/bind/db.northwind.lab";
    allow-transfer { any; };
};
