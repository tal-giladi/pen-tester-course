// ns1 — the PRIMARY. Properly configured: zone transfers DENIED to everyone.
options {
    directory "/var/cache/bind";
    recursion yes;                 // acts as the lab resolver (10.13.0.53)
    allow-recursion { any; };
    dnssec-validation no;
    listen-on { any; };
    listen-on-v6 { none; };
    allow-transfer { none; };      // correct: no AXFR here
};

zone "northwind.lab" {
    type master;
    file "/etc/bind/db.northwind.lab";
    allow-transfer { 10.13.0.54; }; // only the secondary may pull (as it should)
};
