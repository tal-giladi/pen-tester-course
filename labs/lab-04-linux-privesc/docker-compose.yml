# lab-04-linux-privesc — intentionally misconfigured Linux target for local privesc.
# Runs on an internal (no-egress) network, so it is NOT reachable from your host: get your
# foothold with `docker exec -u lab` (or SSH from an attacker box attached to the network).
services:
  target:
    build: .
    container_name: ptlab04_target
    hostname: lab04
    networks:
      - ptlab_internal
    # cron + setcap need these; kept minimal and LAB-ONLY.
    cap_add:
      - SETUID
      - SETGID
    restart: unless-stopped

networks:
  ptlab_internal:
    driver: bridge
    internal: true      # no route to the Internet — verify with `./labs/lab check`
