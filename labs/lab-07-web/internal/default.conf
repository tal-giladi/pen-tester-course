# Internal-only services — NOT published to the host. Reachable ONLY from the app
# container (i.e. only via SSRF through /fetch). Everything benign/synthetic.

# The internal API holds a synthetic "secret" an SSRF can reach.
server {
    listen 80;
    server_name internal-api internal-api.lab;
    location = /secret { default_type application/json; return 200 '{"service":"internal-api","flag":"LAB-FLAG-ssrf-internal-9z8y7x"}'; }
    location / { return 200 "internal-api (lab) — reachable only from inside the network\n"; }
}

# A cloud-metadata SIMULATION (teaches SSRF-to-metadata for M14). This is a LOCAL
# stand-in, not a real 169.254.169.254 endpoint. Credentials are fake/benign.
server {
    listen 80 default_server;
    server_name metadata metadata.lab;
    location = /latest/meta-data/ { return 200 "iam/\ninstance-id\n"; }
    location = /latest/meta-data/iam/security-credentials/ { return 200 "northwind-app-role\n"; }
    location = /latest/meta-data/iam/security-credentials/northwind-app-role {
        default_type application/json;
        return 200 '{"AccessKeyId":"AKIA-LAB-EXAMPLE","SecretAccessKey":"LAB-FAKE-do-not-use","Token":"LAB-FLAG-ssrf-metadata-role","Expiration":"2030-01-01T00:00:00Z"}';
    }
    location / { return 200 "metadata simulation (lab)\n"; }
}
