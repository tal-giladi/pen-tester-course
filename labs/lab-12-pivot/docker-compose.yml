# lab-12-pivot — a segmented network you must pivot through. LAB ONLY, all networks
# internal (no egress). Topology (attacker cannot reach internal/restricted directly):
#
#   ws ──net_edge── dmz ──net_internal── internal ──net_restricted── restricted (flag)
#
# The dmz host is your foothold and first pivot; internal is the second pivot; the flag
# lives on restricted, reachable only from internal. Work from ws: docker exec -it ptlab12_ws bash
services:
  ws:                                   # attacker workstation (edge only)
    build: ./workstation
    container_name: ptlab12_ws
    networks: [net_edge]
    restart: unless-stopped

  dmz:                                  # foothold + pivot #1 (edge + internal)
    build: ./pivot-host
    container_name: ptlab12_dmz
    hostname: dmz
    networks: [net_edge, net_internal]
    restart: unless-stopped

  internal:                             # pivot #2 (internal + restricted)
    build: ./pivot-host
    container_name: ptlab12_internal
    hostname: internal
    networks: [net_internal, net_restricted]
    restart: unless-stopped

  restricted:                           # final target (restricted only)
    image: nginx:1.27-alpine
    container_name: ptlab12_restricted
    hostname: restricted
    volumes:
      - ./restricted/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [net_restricted]
    restart: unless-stopped

networks:
  net_edge:       { driver: bridge, internal: true }
  net_internal:   { driver: bridge, internal: true }
  net_restricted: { driver: bridge, internal: true }
