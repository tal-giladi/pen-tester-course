<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penetration Testing &amp; Ethical Hacking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="A serious, modern, self-paced penetration-testing course for experienced engineers: methodology, recon, enumeration, Linux/Windows/Active Directory, web & API, exploitation, credentials, lateral movement, pivoting, containers, cloud, red team, and professional reporting — every concept reproduced in a safe, local, resettable lab.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    :root {
      --theme-color: #1f9d55;          /* terminal green */
      --sidebar-width: 18rem;
    }
    .sidebar { padding-top: 20px; }
    .sidebar > h1 { margin: 0 20px 10px; font-size: 1.05em; }
    .sidebar ul li a { font-size: 14px; }
    .markdown-section { max-width: 940px; }
    .markdown-section pre { border-radius: 6px; }
    /* Callout boxes used throughout the lessons */
    .callout { border-left: 4px solid var(--theme-color); background: #eef7f1;
      padding: 0.8em 1em; margin: 1.2em 0; border-radius: 0 6px 6px 0; }
    .callout.warn  { border-left-color: #e0a800; background: #fdf9e7; }
    .callout.key   { border-left-color: #1f7a5a; background: #eef7f3; }
    .callout.legal { border-left-color: #c92a2a; background: #fff0f0; }
    .callout.recon { border-left-color: #1864ab; background: #eef4fc; }
    .callout.attack{ border-left-color: #d9480f; background: #fff4e6; }
    .callout.defend{ border-left-color: #2b8a3e; background: #f0faf2; }
    .callout.method{ border-left-color: #6741d9; background: #f3f0fc; }
    .callout p:first-child { margin-top: 0; }
    .callout p:last-child { margin-bottom: 0; }
    /* Lab / prereq / hardware boxes */
    .lab { font-size: 0.92em; background: #f5fbf7; border: 1px solid #b2e2c6;
      border-radius: 8px; padding: 0.6em 1em; margin: 1.2em 0; }
    .lab p { margin: 0.3em 0; }
    .prereq { font-size: 0.92em; background: #f4f4f8; border: 1px solid #e2e2ee;
      border-radius: 8px; padding: 0.6em 1em; margin-bottom: 1.5em; }
    .prereq p { margin: 0.3em 0; }
    .hw { font-size: 0.9em; background: #f0f6ff; border: 1px solid #d0e2ff;
      border-radius: 8px; padding: 0.6em 1em; margin: 1.2em 0; }
    .hw p { margin: 0.3em 0; }
    table { display: table; width: 100%; }
    .badge { display: inline-block; font-size: 0.72em; font-weight: 600; padding: 1px 8px;
      border-radius: 10px; background: #e7f2ec; color: #1f7a5a; margin-left: 6px; vertical-align: middle; }
    .badge.found { background:#e7f2ec; color:#1f7a5a; }
    .badge.current { background:#eef4fc; color:#1864ab; }
    .badge.emerging { background:#f3f0fc; color:#6741d9; }
    .badge.deprecated { background:#f1f3f5; color:#868e96; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Pentesting &amp; Ethical Hacking',
      repo: 'https://github.com/tal-giladi/pen-tester-course',
      loadSidebar: true,
      subMaxLevel: 0,
      auto2top: true,
      maxLevel: 4,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      search: {
        placeholder: 'Search the course...',
        noData: 'No results.',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      count: { countable: true }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-count/dist/countable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-http.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
</body>
</html>
